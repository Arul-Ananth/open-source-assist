# Production Docker Compose — run on EC2
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  # ── Optional Local PostgreSQL (Use profile 'local-db' if not using remote AWS RDS) ──
  postgres:
    image: postgres:16-alpine
    container_name: osa_postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_source_assist}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      retries: 5

  # ── Optional Local Qdrant (Use profile 'local-db' if not using Qdrant Cloud) ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: osa_qdrant
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      retries: 5

  # ── Redis (In-Memory Cache & OTP Store) ──
  redis:
    image: redis:7-alpine
    container_name: osa_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── FastAPI Backend ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: osa_backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      SERVER_RELOAD: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # ── React Frontend (served by Nginx) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: osa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "0.0.0.0:3000:80"

volumes:
  pg_data:
    driver: local
  qdrant_data:
    driver: local
