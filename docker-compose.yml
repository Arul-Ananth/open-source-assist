services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: open_source_assist_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local

